# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # Photos in content/media are resized to WebP by scripts/optimize-images.py.
      # The cache keeps already-processed photos, so only new uploads are resized.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install photo tools
        run: pip install --quiet Pillow pillow-heif

      - uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('content/media/**', 'scripts/optimize-images.py') }}
          restore-keys: images-

      - name: Build site
        run: node build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Preview deployment: keep it out of search engines until launch.
          # Remove this line when the site goes live with real content.
          NOINDEX: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
